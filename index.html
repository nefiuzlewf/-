<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Проверка безопасности</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Segoe UI', Arial, sans-serif;
    background: linear-gradient(135deg, #1a1a2e, #16213e);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #fff;
    overflow: hidden;
  }
  .container {
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.1);
    padding: 40px 30px;
    border-radius: 16px;
    max-width: 420px;
    text-align: center;
    backdrop-filter: blur(10px);
    box-shadow: 0 8px 32px rgba(0,0,0,0.4);
  }
  h1 { font-size: 24px; margin-bottom: 12px; }
  p { color: #a0a0b0; font-size: 14px; margin-bottom: 24px; line-height: 1.5; }
  button {
    background: #e94560;
    color: #fff;
    border: none;
    padding: 14px 32px;
    font-size: 16px;
    border-radius: 8px;
    cursor: pointer;
    transition: 0.2s;
    width: 100%;
  }
  button:hover { background: #ff5773; transform: scale(1.02); }
  .loader {
    display: none;
    margin-top: 20px;
  }
  .bar {
    width: 100%;
    height: 8px;
    background: rgba(255,255,255,0.1);
    border-radius: 4px;
    overflow: hidden;
  }
  .bar-fill {
    height: 100%;
    width: 0%;
    background: #e94560;
    transition: width 0.15s linear;
  }
  .status { margin-top: 10px; font-size: 13px; color: #a0a0b0; }

  /* Скример */
  #screamer {
    display: none;
    position: fixed;
    inset: 0;
    z-index: 9999;
    background: #000;
  }
  #screamer img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    animation: shake 0.1s infinite;
  }
  @keyframes shake {
    0% { transform: translate(0,0) scale(1); }
    25% { transform: translate(-10px, 5px) scale(1.05); }
    50% { transform: translate(10px, -5px) scale(1.05); }
    75% { transform: translate(-5px, -10px) scale(1.05); }
    100% { transform: translate(5px, 10px) scale(1); }
  }
</style>
</head>
<body>

<div class="container" id="mainBox">
  <h1>🔒 Проверка устройства</h1>
  <p>Нажмите кнопку ниже, чтобы начать сканирование системы на наличие угроз.</p>
  <button onclick="startScan()">Начать проверку</button>
  <div class="loader" id="loader">
    <div class="bar"><div class="bar-fill" id="barFill"></div></div>
    <div class="status" id="status">Сканирование...</div>
  </div>
</div>

<div id="screamer">
  <!-- Вставьте сюда ссылку на страшную картинку -->
  <img id="scaryImg" src="" alt="">
</div>

<script>
  // ==== НАСТРОЙКА ====
  // Замените на свою ссылку на страшную картинку (прямая ссылка на изображение)
  // Пример: 'https://i.imgur.com/xxxxx.jpg'
  const SCARY_IMAGE_URL = 'scary.jpg'; // <-- ЗАМЕНИТЕ

  const mainBox = document.getElementById('mainBox');
  const loader = document.getElementById('loader');
  const barFill = document.getElementById('barFill');
  const status = document.getElementById('status');
  const screamer = document.getElementById('screamer');
  const scaryImg = document.getElementById('scaryImg');

  function startScan() {
    mainBox.querySelector('button').style.display = 'none';
    loader.style.display = 'block';

    let progress = 0;
    const messages = [
      'Сканирование...',
      'Проверка файлов...',
      'Обнаружена угроза!',
      'Критическая ошибка!'
    ];

    const interval = setInterval(() => {
      progress += Math.random() * 12 + 3;
      if (progress > 100) progress = 100;
      barFill.style.width = progress + '%';

      if (progress > 30) status.textContent = messages[1];
      if (progress > 60) {
        status.textContent = messages[2];
        status.style.color = '#ff5773';
      }

      if (progress >= 100) {
        clearInterval(interval);
        status.textContent = messages[3];
        setTimeout(triggerScreamer, 600);
      }
    }, 180);
  }

  function triggerScreamer() {
    scaryImg.src = SCARY_IMAGE_URL;
    screamer.style.display = 'block';

    // Громкий звук (синтезированный, чтобы не зависеть от файлов)
    playScream();

    // Через 3 секунды всё исчезает
    setTimeout(() => {
      screamer.style.display = 'none';
      mainBox.style.display = 'none';
      document.body.innerHTML = '<div style="text-align:center;padding:20px;font-size:20px;">😱 Попался!<br><br><small style="font-size:14px;color:#888">Это был пранк. Обнови страницу.</small></div>';
      document.body.style.background = '#111';
      document.body.style.color = '#fff';
      document.body.style.display = 'flex';
      document.body.style.alignItems = 'center';
      document.body.style.justifyContent = 'center';
    }, 3000);
  }

  // Синтез резкого звука через Web Audio API
  function playScream() {
    try {
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(800, ctx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(120, ctx.currentTime + 0.5);
      osc.frequency.exponentialRampToValueAtTime(900, ctx.currentTime + 1);
      gain.gain.setValueAtTime(0.3, ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 1.2);
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start();
      osc.stop(ctx.currentTime + 1.2);
    } catch(e) { /* если браузер блокирует звук */ }
  }
</script>
</body>
</html>
